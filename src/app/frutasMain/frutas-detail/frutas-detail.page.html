<ion-header>
<ion-toolbar class="logo-toolbar">
<ion-buttons slot="start">

  <ion-menu-button class="menu-btn"></ion-menu-button>
</ion-buttons>
  <ion-title>
    <img
      src="assets/onePiece.jpg"
      class="logo"
      alt="One Piece Logo"
       [routerLink]="['/home']">
  </ion-title>

  <ion-buttons slot="end">
    <ion-button
      class="info-button"
      fill="solid"
      size="small"
      shape = "round"
      color="primary"
      [routerLink]="['/info']">
      Sobre
    </ion-button>
  </ion-buttons>

</ion-toolbar>
  </ion-header>

<ion-content class="ion-padding">
  @if (fruta$ | async; as fruta) {
    <ion-card class="card--fruta-detail">

      <ion-back-button
      defaultHref="/tabs/frutas"
      text=""
       icon="arrow-back">
      </ion-back-button>

      <ion-buttons class="favorite-button" fill="clear" (click)="toggleFavorite(fruta)">
  <ion-icon
    slot="icon-only"
    size="large"
    [name]="isFavorite ? 'heart' : 'heart-outline'"
    [color]="isFavorite ? 'danger' : 'dark'">
  </ion-icon>
</ion-buttons>

      <h1 class="fruta-title">{{ fruta.name }}</h1>
    <img [src]="fruta.filename || '../assets/placeholder.jpg'" [alt]="fruta.name" class="fruit-image"
          (error)="$any($event.target).src='../assets/placeholder.jpg'">
      <p class="description"> {{ fruta.description }}</p> 

    </ion-card>
  }
</ion-content>
