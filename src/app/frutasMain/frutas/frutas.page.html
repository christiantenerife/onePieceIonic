<ion-header>
<ion-toolbar class="logo-toolbar">

  <ion-title>
    <img
      src="assets/onePiece.jpg"
      class="logo"
      alt="One Piece Logo"
       [routerLink]="['/home']">
  </ion-title>

  <ion-buttons slot="end">
    <ion-button
      class="info-button"
      fill="solid"
      size="small"
      shape = "round"
      color="primary"
      [routerLink]="['/info']">
      Ver mi información
    </ion-button>
  </ion-buttons>

</ion-toolbar>
  </ion-header>
<ion-content class="ion-padding">

  <ion-text class="page">
    <h1 class="page-title">Frutas</h1>
    <p class="page-subtitle">Descubre las Frutas de OnePiece</p>
  </ion-text>

  @if (loading) {
    <ion-text>
      <p class="status-message">Cargando frutas...</p>
    </ion-text>
  }

  @if (error) {
    <ion-text color="danger">
      <p class="error">{{ error }}</p>
    </ion-text>
  }

  @if (!loading && apiFrutas.length > 0) {
    <ion-grid class="card-grid">
      <ion-row>
        @for (fruta of apiFrutas; track fruta.id) {
          <ion-col size="6">
            <ion-card class="card" [routerLink]="['/tabs/frutas', fruta.id]">

              <img  
                class="fruit-image"  
                [src]="fruta.filename || '../assets/placeholder.jpg'"
                [alt]="fruta.name"
                (error)="$any($event.target).src='../assets/placeholder.jpg'"> 
              <ion-card-header>
                <ion-card-title>{{ fruta.name }}</ion-card-title>
              </ion-card-header>

            </ion-card>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  }
</ion-content>
