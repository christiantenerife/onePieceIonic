<ion-header>
<ion-toolbar class="logo-toolbar">
<ion-buttons slot="start">
  <ion-menu-button class="menu-btn"></ion-menu-button>
</ion-buttons>
  <ion-title>
    <img
      src="assets/onePiece.jpg"
      class="logo"
      alt="One Piece Logo"
       [routerLink]="['/home']">
  </ion-title>

  <ion-buttons slot="end">
    <ion-button
      class="info-button"
      fill="solid"
      size="small"
      shape = "round"
      color="primary"
      [routerLink]="['/info']">
      Sobre
    </ion-button>
  </ion-buttons>

</ion-toolbar>
  </ion-header>

<ion-content class="info-content">

  <ion-card class="info-card">

    <ion-back-button
      defaultHref="/home"
      text=""
       icon="arrow-back">
      </ion-back-button>

   
    <h1>Sobre mí</h1>

    <h2>Christian Moore</h2>

    <p>
      Soy estudiante de DAM (FPGS) y este proyecto en Ionic muestra sagas,
      personajes y frutas de One Piece usando una API.
    </p>

  </ion-card>

</ion-content>
