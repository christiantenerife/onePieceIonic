<ion-header>
  <ion-toolbar>
    <ion-title>Personajes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page">
    <h1 class="page-title">Personajes</h1>

    <p class="page-subtitle">
      Descubre los Personajes de OnePiece
    </p>
  </div>

   @if (loading) {
    <p class="status-message">Cargando personajes...</p>
  }

  @if (error) {
    <p class="error">{{ error }}</p>
  }

 @if (!loading && apiPersonajes.length > 0) {
  <div class="card-grid">

    @for (personaje of apiPersonajes; track personaje.id) {
      <div class="card" [routerLink]="['/tabs/personajes', personaje.id]">
        <h3>{{ personaje.name }}</h3>
      </div>
    }

  </div>
}
</ion-content>
